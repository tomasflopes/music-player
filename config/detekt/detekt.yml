# Builds on detekt's defaults (see QualityConventions.kt). Only deviations live here.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    # Config data classes (LibraryConfig, SearchConfig, PlaybackConfig) are where tunable numbers belong.
    excludes: ['**/config/**', '**/test/**', '**/testFixtures/**', '**/androidTest/**']
    ignorePropertyDeclaration: true
    ignoreExtensionFunctions: true
complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # PlayQueue's API (plan Task 13) has 13 public functions; DAOs and Hilt modules also legitimately grow.
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerObject: 20
